<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booting Sequence...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            position: relative;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 0.3rem;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 1.5s ease-in forwards;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 0.2rem;
            opacity: 0;
            animation: fadeIn 1.5s ease-in 0.5s forwards;
        }

        .loading-bar {
            width: 400px;
            height: 4px;
            background: #222;
            margin: 3rem auto;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 1s ease-in 1s forwards;
        }

        .loading-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #fff;
            animation: loadBar 2s ease-in-out infinite;
        }

        .circles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        .circle:nth-child(1) {
            width: 200px;
            height: 200px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 15%;
            animation-delay: 1s;
        }

        .circle:nth-child(3) {
            width: 300px;
            height: 300px;
            bottom: 10%;
            left: 30%;
            animation-delay: 2s;
        }

        .circle:nth-child(4) {
            width: 100px;
            height: 100px;
            top: 40%;
            right: 30%;
            animation-delay: 1.5s;
        }

        .status {
            font-size: 0.9rem;
            color: #888;
            margin-top: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease-in 1.5s forwards, blink 1.5s ease-in-out 2s infinite;
        }

        .cursor-trail {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
            z-index: 9999;
        }

        .mouse-line {
            position: fixed;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 1;
        }

        .mouse-line.horizontal {
            height: 1px;
            width: 100%;
            top: 0;
            left: 0;
        }

        .mouse-line.vertical {
            width: 1px;
            height: 100%;
            top: 0;
            left: 0;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes loadBar {
            0% {
                left: -100%;
            }
            50% {
                left: 100%;
            }
            100% {
                left: 100%;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.3;
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }


        @media (max-width: 600px) {
            .title {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 1rem;
            }
            .loading-bar {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="mouse-line horizontal"></div>
    <div class="mouse-line vertical"></div>

    <div class="container">
        <h1 class="title">BOOTING NEW SEQUENCE</h1>
        <p class="subtitle">INITIALIZING SYSTEM...</p>
        <div class="loading-bar"></div>
        <p class="status">▸ LOADING_</p>
    </div>

    <script>
        // Mouse tracker
        const cursorTrails = [];
        const trailLength = 8;

        // Create cursor trails
        for (let i = 0; i < trailLength; i++) {
            const trail = document.createElement('div');
            trail.className = 'cursor-trail';
            trail.style.opacity = (trailLength - i) / trailLength * 0.5;
            trail.style.width = (20 - i * 2) + 'px';
            trail.style.height = (20 - i * 2) + 'px';
            document.body.appendChild(trail);
            cursorTrails.push({ element: trail, x: 0, y: 0 });
        }

        const horizontalLine = document.querySelector('.mouse-line.horizontal');
        const verticalLine = document.querySelector('.mouse-line.vertical');

        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Update crosshair lines
            horizontalLine.style.top = mouseY + 'px';
            verticalLine.style.left = mouseX + 'px';
        });

        // Animate cursor trails
        function animateTrails() {
            cursorTrails.forEach((trail, index) => {
                if (index === 0) {
                    trail.x = mouseX;
                    trail.y = mouseY;
                } else {
                    const prevTrail = cursorTrails[index - 1];
                    trail.x += (prevTrail.x - trail.x) * 0.3;
                    trail.y += (prevTrail.y - trail.y) * 0.3;
                }

                trail.element.style.left = trail.x + 'px';
                trail.element.style.top = trail.y + 'px';
            });

            requestAnimationFrame(animateTrails);
        }

        animateTrails();
    </script>
</body>
</html>
